    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0b1a14">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --usf-green: #005A3C;
            --usf-gold: #D4C571;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-glow: rgba(212, 197, 113, 0.2);
            --text-light: #F4F6F8;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            background-color: #0b1a14;
            background-image: 
                radial-gradient(at 0% 0%, hsla(158, 100%, 15%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 100%, hsla(50, 40%, 25%, 1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-light);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Top Navigation / Header Area */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 40px 50px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .brand-section h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, var(--usf-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        
        .brand-section p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.7;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* Search & Toggle Box */
        .search-container-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }

        .mode-toggle-group {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 3px;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 4px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .toggle-btn.active {
            background: var(--usf-gold);
            color: #000;
            box-shadow: 0 0 10px var(--glass-glow);
        }

        .search-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            padding: 5px 5px 5px 20px;
            width: 330px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .search-pill:focus-within {
            border-color: var(--usf-gold);
            box-shadow: 0 0 15px var(--glass-glow);
            background: rgba(255, 255, 255, 0.12);
            width: 380px;
        }

        .search-pill input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        .search-pill input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-pill button {
            background: var(--usf-green);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            margin-left: 5px;
        }

        .search-pill button:hover {
            background: #00452e;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(212, 197, 113, 0.3);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 50px 50px;
        }

        /* Main Category Controls */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            padding: 25px;
            margin-bottom: 40px;
        }

        .bubble-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        
        .bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            transition: all 0.3s ease;
        }
        
        .bubble:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }
        
        .bubble.active {
            background: var(--usf-gold);
            color: #000;
            border-color: var(--usf-gold);
            box-shadow: 0 0 15px var(--glass-glow);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: 25px;
        }

        .perk-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            cursor: pointer;
        }
        
        .perk-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            border-color: rgba(212, 197, 113, 0.5);
        }

        .category-tag {
            display: inline-block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--usf-gold);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin: 0 0 15px 0;
            color: #fff;
            line-height: 1.3;
        }

        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            font-size: 0.95rem;
        }
        .info-row strong {
            min-width: 80px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }
        .info-row span {
            flex: 1;
            font-weight: 600;
        }

        .click-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            text-align: right;
            color: var(--usf-gold);
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .perk-card:hover .click-hint {
            opacity: 1;
        }

        /* Modal / Glass Bubble Pop-Up */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .glass-modal {
            background: rgba(30, 45, 55, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            transform: translateY(40px) scale(0.9);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .glass-modal {
            transform: translateY(0) scale(1);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
            padding: 10px;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: #fff;
            line-height: 1.2;
        }

        .modal-category {
            color: var(--usf-gold);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: block;
        }

        .modal-details {
            background: rgba(0,0,0,0.25);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .modal-details p {
            margin: 12px 0;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .modal-details strong {
            color: rgba(255,255,255,0.6);
            display: inline-block;
            width: 100px;
        }

        .action-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--usf-green);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: #00452e;
            border-color: var(--usf-gold);
            box-shadow: 0 0 20px rgba(212, 197, 113, 0.4);
            transform: translateY(-2px);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .highlight-text {
            color: var(--usf-gold);
            font-weight: 600;
        }

        .empty-search-btn {
            max-width: 320px;
            margin: 0 auto;
        }

        #emptyState {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            font-size: 1.3rem;
            color: rgba(255,255,255,0.6);
            background: var(--glass-bg);
            border-radius: 20px;
            border: 1px dashed rgba(255,255,255,0.3);
            display: none;
        }
        
        #emptyState p {
            margin-bottom: 20px;
        }

        @media (max-width: 850px) {
            body, html { background-attachment: scroll; }
            .top-nav { flex-direction: column; align-items: center; gap: 20px; padding: 40px 20px 20px; text-align: center; }
            .search-container-box { align-items: center; width: 100%; }
            .container { padding: 0 20px 40px; }
            .search-pill { width: 100%; max-width: 400px; }
            .search-pill:focus-within { width: 100%; max-width: 400px; }
            h1 { font-size: 2.2rem !important; }
            .glass-modal { padding: 30px 20px; }
            .modal-title { font-size: 1.6rem; }
        }

        @media (max-width: 420px) {
            .brand-section h1 { font-size: 1.8rem !important; }
            .brand-section p { font-size: 0.95rem; }
            .mode-toggle-group { width: 100%; justify-content: center; }
            .toggle-btn { flex: 1; }
            .glass-panel { padding: 18px; }
            .perk-card { padding: 20px; }
            .results-grid { gap: 16px; }
        }
    </style>
</head>

        const resultsGrid = document.getElementById('resultsGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const emptySearchBtn = document.getElementById('emptySearchBtn');
        const bubbleContainer = document.getElementById('bubbleFilters');
        const emptyState = document.getElementById('emptyState');
        const modePerksBtn = document.getElementById('modePerks');
        const modeNeedItBtn = document.getElementById('modeNeedIt');

        // Modal Elements
        const modalOverlay = document.getElementById('perkModal');
        const closeModalBtn = document.getElementById('closeModal');
        const mTitle = document.getElementById('modalTitle');
        const mCategory = document.getElementById('modalCategory');
        const mCost = document.getElementById('modalCost');
        const mEligibility = document.getElementById('modalEligibility');
        const mAction = document.getElementById('modalAction');
        const mLink = document.getElementById('modalLink');

        let activeCategory = 'All';
        let currentSearchMode = 'perks'; // 'perks' or 'needit'

        // Mode Toggle Buttons Logic
        modePerksBtn.addEventListener('click', () => {
            modePerksBtn.classList.add('active');
            modeNeedItBtn.classList.remove('active');
            modePerksBtn.setAttribute('aria-pressed', 'true');
            modeNeedItBtn.setAttribute('aria-pressed', 'false');
            currentSearchMode = 'perks';
            searchInput.placeholder = "Search app, or tap 🔍 for deals...";
        });

        modeNeedItBtn.addEventListener('click', () => {
            modeNeedItBtn.classList.add('active');
            modePerksBtn.classList.remove('active');
            modeNeedItBtn.setAttribute('aria-pressed', 'true');
            modePerksBtn.setAttribute('aria-pressed', 'false');
            currentSearchMode = 'needit';
            searchInput.placeholder = "Find item nearby (e.g. key cut)...";
        });

        const categories = [...new Set(perksData.map(item => item.category))];
        
        const iconMap = {
            "Technology & Software": "💻",
            "Streaming & Subscriptions": "📺",
            "Campus & USF Resources": "🏛️",
            "Culture & Education": "🎭",
            "Sports, Golf & Recreation": "🏆",
            "Food & Restaurants": "🍔",
            "Transportation & Travel": "✈️",
            "Shopping, Lifestyle & Wellness": "🛍️",
            "Automotive & Car Care": "🚗",
            "Student Verification Keys": "🔑"
        };

        categories.forEach(cat => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.dataset.category = cat;
            bubble.textContent = `${iconMap[cat] || '✨'} ${cat}`;
            
            bubble.addEventListener('click', () => {
                document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
                bubble.classList.add('active');
                activeCategory = cat;
                renderCards();
            });
            
            bubbleContainer.appendChild(bubble);
        });

        document.querySelector('.bubble[data-category="All"]').addEventListener('click', function() {
            document.querySelectorAll('.bubble').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            activeCategory = 'All';
            renderCards();
        });

        // Smart Web Search Logic (Switches depending on active toggle mode)
        function executeSmartSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            let fullQuery = "";

            if (currentSearchMode === 'perks') {
                // "Find Deals" Parameter Formula
                const verification = '("University of South Florida students" OR "Student ID" OR "student discount")';
                const geography = '(USF OR Tampa OR "Temple Terrace" OR "Fowler Ave")';
                fullQuery = `${query} ${verification} ${geography}`;
            } else {
                // "Need It Now" Local Maps/Proximity Formula (Triggers Maps Grid + Local Stores)
                fullQuery = `${query} near "USF" Tampa FL in stock`;
            }

            const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(fullQuery)}`;
            window.open(googleUrl, '_blank', 'noopener,noreferrer');
        }

        searchBtn.addEventListener('click', executeSmartSearch);
        emptySearchBtn.addEventListener('click', executeSmartSearch);
        
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                executeSmartSearch();
            }
        });

        function openModal(item) {
            mTitle.textContent = item.opportunity;
            mCategory.textContent = item.category;
            mCost.textContent = item.cost;
            mEligibility.textContent = item.eligibility;
            mAction.textContent = item.how_to_get_it;
            mLink.href = item.link;
            
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        // Render Local Directory filtering as user types
        function renderCards() {
            const searchTerm = searchInput.value.toLowerCase();
            resultsGrid.innerHTML = '';
            let count = 0;

            perksData.forEach(item => {
                const matchesSearch = item.opportunity.toLowerCase().includes(searchTerm) || 
                                      item.how_to_get_it.toLowerCase().includes(searchTerm) ||
                                      item.category.toLowerCase().includes(searchTerm);
                const matchesCategory = activeCategory === 'All' || item.category === activeCategory;

                if (matchesSearch && matchesCategory) {
                    count++;
                    const card = document.createElement('div');
                    card.className = 'perk-card';
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="category-tag">${item.category}</div>
                            <h3 class="card-title">${item.opportunity}</h3>
                        </div>
                        <div class="card-body">
                            <div class="info-row">
                                <strong>Cost:</strong>
                                <span class="highlight-text">${item.cost}</span>
                            </div>
                            <div class="info-row">
                                <strong>Access:</strong>
                                <span>${item.eligibility}</span>
                            </div>
                        </div>
                        <div class="click-hint">Click for details & link ↗</div>
                    `;
                    
                    card.addEventListener('click', () => openModal(item));
                    
                    resultsGrid.appendChild(card);
                }
            });

            // Show Empty State with Web Search Button if nothing found locally
            if (count === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }
        }

        // Trigger local filtering every time the user types a letter
        searchInput.addEventListener('input', renderCards);

        // Modal close listeners
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        });

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                modalOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // Initial Boot
        renderCards();
    </script>
